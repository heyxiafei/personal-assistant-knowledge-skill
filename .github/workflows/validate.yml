name: Validate skill

on:
  push:
    branches: [main, quick-start-local-20261028]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Package and privacy checks
        run: python -B scripts/check_package.py
      - name: Full synthetic test suite including offline DOM
        run: |
          export SESSION_BUNDLE_NODE="$(command -v node)"
          python -B -m unittest discover -s tests -v
      - name: Clean isolated installation
        run: python -B scripts/check_clean_install.py
      - name: Whitespace check
        run: git diff --check
